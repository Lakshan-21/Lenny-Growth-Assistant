[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-workspace-backend"
version = "0.1.0"
description = "Backend for the Lenny Growth Workspace AI workspace (FastAPI, vertical slice architecture)."
requires-python = ">=3.12"
readme = "README.md"

# Every entry below is actually imported somewhere in app/ (verified via
# a grep over all import statements, not copied from a template) plus the
# two runtime-only additions noted inline. No aspirational/future
# dependencies (e.g. supabase-py, PyJWT) are listed — those integrations
# are still stubbed (see auth/supabase_client.py, auth/dependencies.py)
# and are intentionally out of scope per this task's requirements.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",        # ASGI server -- not imported by app code, but required to run it
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",                  # Postgres driver -- loaded by SQLAlchemy's postgresql+asyncpg:// dialect, not imported by name
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "markdown>=3.7",
    "nh3>=0.2.18",
    "anthropic>=0.40",
    "pyyaml>=6.0",                    # parses transcript.md YAML frontmatter (ingestion/loaders.py)
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
