[alembic]
# Migrations live under app/database/migrations, per REPOSITORY_STRUCTURE.md
# (not a top-level backend/alembic/ directory).
script_location = app/database/migrations

# Timestamp + sequential prefix, e.g. 0001_20260802_1200_initial_schema.py,
# so files sort chronologically and by revision number simultaneously.
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

prepend_sys_path = .

timezone = UTC

version_path_separator = os

# sqlalchemy.url is intentionally left unset here — app/database/migrations/env.py
# sets it at runtime from app.config.get_settings().DATABASE_URL, so the
# connection string is never duplicated between this file and the app's
# own environment-driven configuration.
sqlalchemy.url =

[post_write_hooks]
# No formatting/lint hooks wired in MVP — keep migration generation
# dependency-free. Add a `ruff format` hook here later if desired.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
